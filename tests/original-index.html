<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends Cards — Local Table</title>
<style>
:root{
  --bg:#0a0c11; --panel:#141824; --panel2:#1b2130; --line:#2a3244;
  --text:#e9edf6; --muted:#8d99b0; --dim:#5d6880;
  --accent:#ff5f3c; --accent2:#ffb43c; --good:#4ade80; --bad:#f87171;
  --gold:#ffd166; --blue:#60a5fa; --violet:#c084fc;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #1a2032 0%, var(--bg) 60%);
  color:var(--text); font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
  min-height:100vh;
}
h1,h2,h3{margin:0 0 .4em; line-height:1.15; letter-spacing:-.02em}
h1{font-size:30px} h2{font-size:20px} h3{font-size:16px}
p{margin:0 0 .6em}
small{color:var(--muted)}
code{font-family:ui-monospace,Consolas,monospace; background:#0e1220; padding:1px 5px; border-radius:5px; color:var(--accent2)}
button{font:inherit; cursor:pointer; border-radius:9px; border:1px solid var(--line);
  background:var(--panel2); color:var(--text); padding:8px 14px; transition:.14s}
button:hover:not(:disabled){border-color:var(--accent); background:#232b3d}
button:disabled{opacity:.35; cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#ff6f4d,#e8431f); border-color:#ff7a5c; color:#fff; font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.1)}
button.ghost{background:transparent}
button.danger{border-color:#5a2626; color:#ffb4b4}
button.danger:hover:not(:disabled){border-color:var(--bad); background:#2a1414}
button.big{padding:14px 26px; font-size:17px}
input,select,textarea{font:inherit; background:#0e1220; color:var(--text);
  border:1px solid var(--line); border-radius:9px; padding:8px 10px; width:100%}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent)}
textarea{resize:vertical; min-height:60px}
label{display:block; margin-bottom:10px; font-size:12px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted)}
label input,label select,label textarea{margin-top:5px; text-transform:none; letter-spacing:0; font-size:15px; color:var(--text)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px}
.eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin:0 0 6px}
.spacer{flex:1}

header{position:sticky; top:0; z-index:40; background:rgba(10,12,17,.93);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.bar{display:flex; align-items:center; gap:16px; padding:10px 20px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.03em}
.brand i{display:grid; place-items:center; width:34px; height:34px; border-radius:9px;
  background:linear-gradient(145deg,var(--accent),#b32d10); font-style:normal; font-size:13px; color:#fff}
.phase{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); flex-wrap:wrap}
.pill{padding:3px 10px; border-radius:99px; border:1px solid var(--line);
  font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.pill.live{border-color:#1f6b3a; color:var(--good); background:#0e2418}
.pill.hot{border-color:#7a3a15; color:var(--accent2); background:#241608}
.acting{display:flex; align-items:center; gap:8px; background:var(--panel2);
  border:1px solid var(--line); border-radius:10px; padding:5px 8px}
.acting select{width:auto; min-width:140px; border:none; background:transparent; padding:3px}
.wallet{font-weight:700; color:var(--gold); white-space:nowrap}
nav{display:flex; gap:4px; padding:0 20px 10px; flex-wrap:wrap}
nav button{border:none; background:transparent; color:var(--muted); padding:7px 14px; border-radius:8px}
nav button:hover{background:var(--panel2); color:var(--text); border:none}
nav button.on{background:var(--panel2); color:var(--text); box-shadow:inset 0 -2px 0 var(--accent)}
main{max-width:1240px; margin:0 auto; padding:22px 20px 90px}

.title{margin-bottom:20px}
.title h1{margin-bottom:6px}
.title p{color:var(--muted); max-width:74ch}

.metrics{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px}
.metric{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px}
.metric span{display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim)}
.metric b{display:block; font-size:26px; margin:4px 0 2px; letter-spacing:-.02em}
.metric small{font-size:12px}

table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--dim); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--text)}
td{padding:9px 10px; border-bottom:1px solid #1c2331; vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#171d2b}
.num{text-align:right; font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.chip{display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:10px;
  border:1px solid var(--line); background:var(--panel); cursor:pointer; transition:.14s}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent); background:#2a1b16}
.chip .dot{width:8px; height:8px; border-radius:99px; background:var(--dim)}
.chip.done .dot{background:var(--good)}
.chip s{color:var(--dim); text-decoration:none; font-size:12px}

.allocbar{position:sticky; top:98px; z-index:30; display:flex; align-items:center; gap:16px;
  background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:14px}
.allocbar .n{text-align:center; min-width:64px}
.allocbar .n b{display:block; font-size:24px; line-height:1}
.allocbar .n span{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim)}
.track{flex:1; height:10px; background:#0e1220; border-radius:99px; overflow:hidden; border:1px solid var(--line)}
.track i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s}
.track.def i{background:linear-gradient(90deg,#3b82f6,#22d3ee)}

.alloclist{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px}
.alloc{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px}
.alloc.set{border-color:#5a4520; background:#191408}
.alloc h3{margin-bottom:2px}
.alloc .who{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent2); margin-bottom:4px}
.alloc .meme{color:var(--muted); font-size:13px; margin-bottom:8px; min-height:2.4em}
.alloc .req{font-size:12px; color:var(--dim); margin-bottom:10px}
.alloc .ctl{display:flex; gap:10px; align-items:center}
.alloc input[type=range]{flex:1; accent-color:var(--accent); padding:0}
.alloc input[type=number]{width:76px; text-align:center; font-weight:700; font-size:16px}
body.blur .maskable{filter:blur(7px); transition:filter .12s}
body.blur .maskable:hover, body.blur .maskable:focus-within{filter:none}

.designs{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
.design{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; position:relative}
.design .who{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent2)}
.design p{font-size:13px; color:var(--muted)}
.design .x{position:absolute; top:8px; right:8px; padding:2px 8px; font-size:12px}

.shopgrid{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start}
@media(max-width:900px){.shopgrid{grid-template-columns:1fr}}
.packart{border-radius:14px; padding:26px; text-align:center; margin-bottom:14px;
  background:linear-gradient(160deg,#2b1a3f,#141824 60%,#3a1c12);
  border:1px solid #3a2a52; position:relative; overflow:hidden}
.packart:before{content:""; position:absolute; inset:-40% -10% auto; height:70%;
  background:radial-gradient(closest-side,rgba(255,120,60,.35),transparent); filter:blur(20px)}
.packart span{position:relative; font-size:11px; letter-spacing:.3em; color:var(--accent2)}
.packart b{position:relative; display:block; font-size:32px; letter-spacing:-.03em; margin-top:6px}
.oddsline{display:flex; justify-content:space-between; gap:12px; margin-bottom:12px; font-size:13px}
.oddsline b{color:var(--gold)}
.oddstable{max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:10px; margin-top:10px}
.packrow{display:flex; align-items:center; gap:12px; background:var(--panel);
  border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; flex-wrap:wrap}
.packrow .grow{flex:1; min-width:170px}
.ptype{font-size:10px; letter-spacing:.14em; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted)}
.ptype.BIDDER{color:var(--accent2); border-color:#6b4416}
.ptype.LEGACY{color:var(--blue); border-color:#1d3f6b}
.ptype.RECLAIMED{color:var(--violet); border-color:#4b2a6b}

.overlay{position:fixed; inset:0; z-index:100; background:rgba(5,7,12,.92);
  display:grid; place-items:center; padding:20px; backdrop-filter:blur(4px)}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:22px; max-width:780px; width:100%; max-height:88vh; overflow:auto; position:relative}
.modal .x{position:absolute; top:12px; right:12px}
.reelbox{width:min(960px,95vw)}
.reelview{position:relative; overflow:hidden; border:1px solid var(--line);
  border-radius:14px; background:#080a10; padding:16px 0; margin:14px 0}
.reelview:after{content:""; position:absolute; inset:0; pointer-events:none; z-index:4;
  background:linear-gradient(90deg,#080a10 0%,transparent 18%,transparent 82%,#080a10 100%)}
.reelcenter{position:absolute; top:0; bottom:0; left:50%; width:2px; margin-left:-1px; z-index:3;
  background:linear-gradient(180deg,transparent,var(--accent),transparent)}
.reelcenter:before{content:""; position:absolute; top:-1px; left:50%; transform:translateX(-50%);
  border-left:8px solid transparent; border-right:8px solid transparent; border-top:11px solid var(--accent)}
.strip{display:flex; gap:12px; will-change:transform}
.tile{flex:0 0 132px; height:174px; border-radius:11px; border:1px solid var(--line);
  background:var(--panel2); padding:10px; display:flex; flex-direction:column; justify-content:space-between}
.tile .tw{font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.tile .tt{font-size:13px; font-weight:700; line-height:1.2}
.tile .tp{font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums}
.tile.fail{background:#12151f; border-color:#242a38}
.tile.fail .tt{color:var(--dim)}
.result{text-align:center}
.result h2{font-size:30px}
.serial{display:flex; justify-content:center; gap:14px; margin:12px 0; flex-wrap:wrap}
.serial b{background:#0e1220; border:1px solid var(--line); border-radius:9px;
  padding:8px 16px; font-size:20px; font-variant-numeric:tabular-nums}
.legacyflash{border:1px solid #1d3f6b; background:#0d1b2e; color:var(--blue);
  border-radius:10px; padding:11px; margin-top:12px}
.dbar{height:8px; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent2)); min-width:2px}
.state{font-size:10px; letter-spacing:.1em; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted)}
.state.ACTIVE{color:var(--good); border-color:#1f6b3a}
.state.REDEEMED{color:var(--dim)}
.state.CONSUMED{color:var(--violet); border-color:#4b2a6b}
.cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr)); gap:12px}
.coll{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px; cursor:pointer; transition:.14s}
.coll:hover{border-color:var(--accent); transform:translateY(-2px)}
.coll .who{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent2)}
.coll h3{font-size:15px; margin:3px 0 6px}
.coll .ser{display:flex; gap:8px; font-size:12px; font-variant-numeric:tabular-nums; color:var(--muted); margin:8px 0}
.coll.sel{border-color:var(--accent2); background:#191408}
.notice{border-radius:10px; padding:11px 14px; margin-bottom:14px; font-size:14px;
  background:#0e2418; border:1px solid #1f6b3a; color:#bbf7d0}
.notice.err{background:#2a1414; border-color:#5a2626; color:#fecaca}
.notice.info{background:#0d1b2e; border-color:#1d3f6b; color:#bfdbfe}
.empty{text-align:center; color:var(--dim); padding:34px; border:1px dashed var(--line); border-radius:12px}
details{margin-top:10px} summary{cursor:pointer; color:var(--muted); font-size:13px}
summary:hover{color:var(--text)}
.math{font-family:ui-monospace,Consolas,monospace; font-size:12.5px; line-height:1.95; color:var(--muted)}
.math b{color:var(--accent2); font-weight:600}
.split{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.cfg{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px}
footer{position:fixed; bottom:0; left:0; right:0; background:rgba(10,12,17,.95);
  border-top:1px solid var(--line); padding:7px 20px; font-size:12px; color:var(--dim);
  display:flex; gap:16px; align-items:center; backdrop-filter:blur(8px); flex-wrap:wrap}
footer label{margin:0; text-transform:none; letter-spacing:0; font-size:12px;
  display:flex; gap:6px; align-items:center; color:var(--dim)}
footer input{width:auto; margin:0}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><i>FC</i><span>Friends Cards</span></div>
    <div class="phase" id="phaseBar"></div>
    <div class="spacer"></div>
    <div class="acting">
      <span style="font-size:11px;letter-spacing:.1em;color:var(--dim)">ACTING AS</span>
      <select id="actingSel"></select>
      <span class="wallet" id="wallet">—</span>
    </div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<footer>
  <span>Local single-file table &middot; nothing leaves this machine</span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="blurTgl"> Blur bid amounts</label>
  <label><input type="checkbox" id="soundTgl"> Sound</label>
  <span id="saveState">saved</span>
</footer>
<div id="overlayHost"></div>
<script>
"use strict";

/* ============================================================
   1. CONFIG + STATE
   ============================================================ */

const DEFAULTS = {
  cardsPerPlayer: 3,      // K
  desireBudget: 100,      // B_D
  defenseBudget: 100,
  weeklyRefill: 100,
  expectedRefills: 4,     // refills per set
  avgSetReward: 400,      // R_avg
  packCost: 50,           // C
  failRefund: 10,         // F
  targetHits: 4,          // T
  bidderFailReward: 20,
  legacyTrigger: 0.20,
  scarcityExponent: 2,    // exponent in S_c
  boostBase: 6,           // G
  legacyAgeExponent: 1    // gamma
};

const CFG_LABELS = {
  cardsPerPlayer:"Cards per player (K)", desireBudget:"Desire budget (B_D)",
  defenseBudget:"Defense budget", weeklyRefill:"Weekly reward", expectedRefills:"Refills per set",
  avgSetReward:"Average set reward", packCost:"Pack cost (C)", failRefund:"Fail refund (F)",
  targetHits:"Target hits/player (T)", bidderFailReward:"Bidder pack fail reward",
  legacyTrigger:"Legacy trigger chance", scarcityExponent:"Scarcity exponent",
  boostBase:"Personal boost base (G)", legacyAgeExponent:"Legacy age exponent"
};

const KEY = "friendsCardsLocal.v1";
let S = null;

function blankState(){
  return {
    version: 1,
    config: Object.assign({}, DEFAULTS),
    players: [],          // {id,name,credits}
    sets: [],             // see newSet()
    instances: [],        // {id,designId,setId,ownerId,floatValue,catalog,state,source,createdAt,tradeCount,note}
    packs: [],            // {id,type,setId,authorId,originBidderId,ownerId,odds,raw,defense,effective,opened,createdAt,tradeCount}
    ledger: [],           // {id,at,playerId,delta,after,type,note}
    log: [],              // {at,text}
    weekly: [],           // {at,amount,count}
    ids: {player:1,set:1,design:1,instance:1,pack:1,ledger:1},
    ui: {tab:"setup", acting:null, blur:false, sound:true, setId:null, marketSort:"demand"}
  };
}

function newSet(ordinal, name, cfg){
  return {
    id: nextId("set"), ordinal, name,
    state: "DRAFT",                 // DRAFT > BIDDING > DEFENSE > LIVE > CLOSED
    config: Object.assign({}, cfg),
    participants: [],               // player ids
    designs: [],                    // {id,authorId,title,meme,request,limits}
    bids: {},                       // bids[bidderId][designId] = amount
    locked: {},                     // locked[bidderId] = true
    defense: {},                    // defense[designId] = amount
    defLocked: {},                  // defLocked[authorId] = true
    snapshot: null,                 // frozen market math
    createdAt: Date.now()
  };
}

function nextId(kind){ return S.ids[kind]++; }

/* ---- persistence ---------------------------------------- */

let saveTimer = null;
let storageOK = true;

// "db"    -> server.py is running; everything lives in friends-cards.db
// "local" -> plain file:// page; falls back to this browser's localStorage
let backend = "local";
let savePending = null, saveInFlight = false, saveDirty = false;

function checkStorage(){
  try{
    localStorage.setItem(KEY + ".probe", "1");
    localStorage.removeItem(KEY + ".probe");
    storageOK = true;
  }catch(e){ storageOK = false; }
  return storageOK;
}

function save(){
  if(backend === "db"){ queueDbSave(); return; }
  if(!storageOK){ flash("NOT SAVING — export a backup", true); return; }
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    flash("saved");
  }catch(e){
    storageOK = false;
    flash("SAVE FAILED — export a backup", true);
  }
}

// Writes are coalesced: dragging a slider fires dozens of state changes and
// only the settled value needs to reach SQLite.
function queueDbSave(){
  saveDirty = true;
  flash("saving…");
  clearTimeout(savePending);
  savePending = setTimeout(pushToDb, 300);
}
function pushToDb(){
  if(saveInFlight){ queueDbSave(); return; }
  saveInFlight = true;
  saveDirty = false;
  fetch("api/state", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(S)
  })
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .then(() => flash("saved to friends-cards.db"))
  .catch(e => flash("DATABASE WRITE FAILED — " + e.message, true))
  .then(() => {
    saveInFlight = false;
    if(saveDirty) queueDbSave();
  });
}
function hydrate(data){
  const fresh = blankState();
  const next = Object.assign(fresh, data);
  next.config = Object.assign({}, DEFAULTS, data.config || {});
  next.ui = Object.assign(fresh.ui, data.ui || {});
  next.ids = Object.assign(fresh.ids, data.ids || {});
  return next;
}
function flash(text, bad){
  const el = document.getElementById("saveState");
  if(!el) return;
  el.textContent = text;
  el.style.color = bad ? "var(--bad)" : "var(--dim)";
  clearTimeout(saveTimer);
  if(!bad) saveTimer = setTimeout(()=>{ el.textContent = "saved"; }, 1400);
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    S = Object.assign(blankState(), parsed);
    S.config = Object.assign({}, DEFAULTS, parsed.config || {});
    S.ui = Object.assign(blankState().ui, parsed.ui || {});
    return true;
  }catch(e){ return false; }
}
function logEvent(text){
  S.log.unshift({at:Date.now(), text});
  if(S.log.length > 600) S.log.length = 600;
}

/* ============================================================
   2. RANDOMNESS  (crypto, never Math.random)
   ============================================================ */

function randUnit(){                       // uniform double in [0,1)
  const b = new Uint32Array(2);
  crypto.getRandomValues(b);
  return (b[0] * 4294967296 + b[1]) / 18446744073709551616;
}
function randInt(n){                       // uniform integer 0..n-1, rejection sampled
  if(n <= 0) return 0;
  const limit = Math.floor(4294967296 / n) * n;
  const b = new Uint32Array(1);
  let x;
  do{ crypto.getRandomValues(b); x = b[0]; } while(x >= limit);
  return x % n;
}
function chance(p){ return randUnit() < p; }
function pickWeighted(weights){            // {key: weight} -> key
  const keys = Object.keys(weights);
  if(!keys.length) return null;
  let total = 0;
  for(const k of keys) total += Math.max(0, weights[k]);
  if(total <= 0) return keys[randInt(keys.length)];
  let point = randUnit() * total, run = 0;
  for(const k of keys){
    run += Math.max(0, weights[k]);
    if(point < run) return k;
  }
  return keys[keys.length - 1];
}

/* ============================================================
   3. ECONOMY MATH  (the formulas from the design)
   ============================================================ */

// S_c = (1 + D_c / Dbar_c) ^ -exponent
function scarcity(demand, avgDemand, exponent){
  if(avgDemand <= 0) return 1;
  return Math.pow(1 + demand / avgDemand, -exponent);
}

// h = T(C - F) / (B - T*F)
function standardHit(budget, target, cost, refund){
  const den = budget - target * refund;
  if(den <= 0 || cost <= refund) return 0;
  return Math.max(0, Math.min(1, target * (cost - refund) / den));
}

// expected credits available per player per set
function expectedBudget(cfg){
  return cfg.avgSetReward + cfg.weeklyRefill * cfg.expectedRefills;
}

function normalize(weights){
  const out = {};
  const keys = Object.keys(weights);
  if(!keys.length) return out;
  let total = 0;
  for(const k of keys) total += Math.max(0, weights[k]);
  if(total <= 0){ for(const k of keys) out[k] = 1 / keys.length; return out; }
  for(const k of keys) out[k] = Math.max(0, weights[k]) / total;
  return out;
}

// R_a = R_avg * D_a / Dbar_a, integerised so the pool is exactly N * R_avg
function largestRemainder(demands, avgReward){
  const keys = Object.keys(demands);
  const out = {};
  if(!keys.length) return out;
  const pool = keys.length * avgReward;
  let total = 0;
  for(const k of keys) total += demands[k];
  if(total <= 0){ for(const k of keys) out[k] = avgReward; return out; }
  const exact = {}, frac = [];
  let used = 0;
  for(const k of keys){
    exact[k] = pool * demands[k] / total;
    out[k] = Math.floor(exact[k]);
    used += out[k];
    frac.push(k);
  }
  frac.sort((a,b)=>{
    const fa = exact[a] - Math.floor(exact[a]);
    const fb = exact[b] - Math.floor(exact[b]);
    if(fb !== fa) return fb - fa;
    return Number(a) - Number(b);
  });
  let left = pool - used;
  for(let i = 0; i < left; i++) out[frac[i % frac.length]] += 1;
  return out;
}

// e_ic = b_ic if b_ic > d_c, else 0
function effectiveBid(raw, defense){ return raw > defense ? raw : 0; }

// M_ic = G ^ (e_ic / B_D);  W = S_c * M_ic;  q = W / sum W
function bidderOdds(scarcities, effective, desireBudget, boostBase, authorDemand, avgAuthorDemand, failReward){
  const hit = avgAuthorDemand <= 0 ? 1 : 1 / (1 + authorDemand / avgAuthorDemand);
  const weighted = {};
  for(const id in scarcities){
    const e = effective[id] || 0;
    weighted[id] = scarcities[id] * Math.pow(boostBase, e / desireBudget);
  }
  const conditional = normalize(weighted);
  const cards = {};
  for(const id in conditional) cards[id] = hit * conditional[id];
  return {hit, fail: 1 - hit, conditional, cards, failReward};
}

function standardOdds(scarcities, hit, failReward){
  const conditional = normalize(scarcities);
  const cards = {};
  for(const id in conditional) cards[id] = hit * conditional[id];
  return {hit, fail: 1 - hit, conditional, cards, failReward};
}

function oddsSum(odds){
  let t = odds.fail;
  for(const id in odds.cards) t += odds.cards[id];
  return t;
}

/* ============================================================
   4. LOOKUPS + CREDIT LEDGER
   ============================================================ */

function player(id){ return S.players.find(p => p.id === Number(id)) || null; }
function playerName(id){ const p = player(id); return p ? p.name : "—"; }
function getSet(id){ return S.sets.find(s => s.id === Number(id)) || null; }
function design(setId, designId){
  const s = getSet(setId);
  return s ? s.designs.find(d => d.id === Number(designId)) || null : null;
}
function findDesign(designId){
  for(const s of S.sets){
    const d = s.designs.find(x => x.id === Number(designId));
    if(d) return {set:s, design:d};
  }
  return null;
}
function liveSet(){ return S.sets.find(s => s.state === "LIVE") || null; }
function currentSet(){
  if(S.ui.setId){ const s = getSet(S.ui.setId); if(s) return s; }
  return S.sets.find(s => s.state !== "CLOSED") || S.sets[S.sets.length - 1] || null;
}
function acting(){ return player(S.ui.acting); }

function credit(playerId, delta, type, note){
  const p = player(playerId);
  if(!p) return false;
  if(p.credits + delta < 0) return false;
  p.credits += delta;
  S.ledger.unshift({
    id: nextId("ledger"), at: Date.now(), playerId: p.id,
    delta, after: p.credits, type, note: note || ""
  });
  if(S.ledger.length > 2000) S.ledger.length = 2000;
  return true;
}

/* ============================================================
   5. FORMATTING HELPERS
   ============================================================ */

function pct(v, digits){
  if(!isFinite(v) || v <= 0) return "0%";
  const d = digits != null ? digits : (v < 0.001 ? 4 : 2);
  return (v * 100).toFixed(d) + "%";
}
function oneIn(v){
  if(!isFinite(v) || v <= 0) return "never";
  const n = 1 / v;
  return "1 in " + (n < 10 ? n.toFixed(2) : Math.round(n).toLocaleString());
}
function floatText(v){ return (v / 100000).toFixed(5); }
function catalogText(v){ return String(v).padStart(3, "0"); }
function when(ts){ return ts ? new Date(ts).toLocaleString() : "—"; }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function initials(name){ return String(name || "?").trim().slice(0,1).toUpperCase(); }

function viewAuction(){
  const set = currentSet();
  if(!set) return '<div class="title"><h1>Auction</h1></div><div class="empty">Create a set in Setup first.</div>';

  let html = '<div class="title"><h1>Auction &middot; Set ' + set.ordinal + "</h1>" +
    "<p>Every player gets " + set.config.desireBudget + " Desire Tokens and spends them on other people's requests. " +
    "Tokens spent here cannot be spent elsewhere — that opportunity cost <em>is</em> the price signal. " +
    "Nothing is revealed until the market closes.</p></div>";
  html += noticeHtml();

  if(set.state === "DRAFT")   return html + '<div class="empty">This set is still in DRAFT. Finish the requests in Setup, then press <b>Open the auction</b>.</div>';
  if(set.state === "LIVE" || set.state === "CLOSED"){
    return html + '<div class="notice">Market closed and frozen. Head to <b>Public Market</b> for the full breakdown, or <b>Shop</b> to start opening packs.</div>' + revealSummary(set);
  }
  if(set.state === "BIDDING") return html + biddingPanel(set);
  if(set.state === "DEFENSE") return html + defensePanel(set);
  return html;
}

function biddingPanel(set){
  const budget = set.config.desireBudget;
  const ids = set.participants;
  let who = S.ui.acting;
  if(ids.indexOf(who) < 0) who = ids[0];

  let html = '<div class="panel"><div class="row"><b>Hand the machine to each player in turn.</b>' +
    '<span class="spacer"></span><small>' + ids.filter(i => set.locked[i]).length + " of " + ids.length + " locked</small></div>";
  html += '<div class="chips" style="margin-top:12px">';
  for(const id of ids){
    html += '<div class="chip ' + (set.locked[id] ? "done " : "") + (id === who ? "on" : "") + '" data-act="pickBidder" data-id="' + id + '">' +
      '<span class="dot"></span><b>' + esc(playerName(id)) + "</b>" +
      "<s>" + (set.locked[id] ? "locked" : "waiting") + "</s></div>";
  }
  html += "</div>";
  const allLocked = ids.every(i => set.locked[i]);
  html += '<div class="row"><button class="primary big" data-act="closeBidding"' + (allLocked ? "" : " disabled") + ">Close bidding &rarr; Defense</button>" +
    "<button data-act=\"forceCloseBidding\">Close anyway (missing players bid 0)</button></div>";
  html += "</div>";

  if(!who) return html;
  const mine = set.bids[who] || {};
  let spent = 0;
  for(const k in mine) spent += mine[k] || 0;
  const eligible = set.designs.filter(d => d.authorId !== who);

  html += '<div class="allocbar"><div class="n maskable"><b>' + spent + "</b><span>spent</span></div>" +
    '<div class="track"><i style="width:' + Math.min(100, spent / budget * 100) + '%"></i></div>' +
    '<div class="n maskable"><b>' + (budget - spent) + "</b><span>left</span></div>" +
    '<button class="primary" data-act="lockBid" data-id="' + who + '"' + (spent === budget ? "" : " disabled") + ">" +
    (set.locked[who] ? "Locked ✓ — relock" : "Lock " + esc(playerName(who)) + "'s allocation") + "</button>" +
    '<button data-act="clearBid" data-id="' + who + '">Clear</button></div>';

  html += '<div class="alloclist">';
  for(const d of eligible){
    const v = mine[d.id] || 0;
    html += '<div class="alloc' + (v > 0 ? " set" : "") + '">' +
      '<div class="who">' + esc(playerName(d.authorId)) + "</div>" +
      "<h3>" + esc(d.title) + '</h3><div class="meme">' + esc(d.meme) + "</div>" +
      '<div class="req">' + esc(d.request) + "</div>" +
      '<div class="ctl"><input type="range" min="0" max="' + budget + '" value="' + v + '" data-bid="' + d.id + '">' +
      '<input class="maskable" type="number" min="0" max="' + budget + '" value="' + v + '" data-bid="' + d.id + '"></div></div>';
  }
  html += "</div>";
  return html;
}

function defensePanel(set){
  const budget = set.config.defenseBudget;
  const ids = set.participants;
  let who = S.ui.acting;
  if(ids.indexOf(who) < 0) who = ids[0];

  const demand = demandMap(set);
  let html = '<div class="panel"><div class="row"><b>Defense: each author decides which of their own promises stays hardest to reach.</b></div>' +
    '<p><small>Authors see how much desire each of their own cards attracted, never who bid or how much any individual bid. ' +
    'A bid breaches only when it is <em>strictly greater</em> than the defense on that card. Defense never changes author income or global scarcity — only privileged pack access.</small></p>';
  html += '<div class="chips" style="margin-top:8px">';
  for(const id of ids){
    html += '<div class="chip ' + (set.defLocked[id] ? "done " : "") + (id === who ? "on" : "") + '" data-act="pickBidder" data-id="' + id + '">' +
      '<span class="dot"></span><b>' + esc(playerName(id)) + "</b><s>" + (set.defLocked[id] ? "locked" : "waiting") + "</s></div>";
  }
  html += "</div>";
  html += '<div class="row"><button class="primary big" data-act="finalize">Reveal &amp; finalize the market</button>' +
    '<button data-act="skipDefense">Skip defense entirely (all zero)</button></div>';
  html += "</div>";

  if(!who) return html;
  const own = set.designs.filter(d => d.authorId === who);
  let authorTotal = 0;
  for(const d of own) authorTotal += demand[d.id] || 0;
  let spent = 0;
  for(const d of own) spent += set.defense[d.id] || 0;

  html += '<div class="allocbar"><div class="n"><b>' + spent + "</b><span>defended</span></div>" +
    '<div class="track def"><i style="width:' + Math.min(100, spent / budget * 100) + '%"></i></div>' +
    '<div class="n"><b>' + (budget - spent) + "</b><span>left</span></div>" +
    '<button class="primary" data-act="lockDefense" data-id="' + who + '"' + (spent === budget ? "" : " disabled") + ">" +
    (set.defLocked[who] ? "Locked ✓ — relock" : "Lock defense") + "</button></div>";

  html += '<div class="alloclist">';
  for(const d of own){
    const v = set.defense[d.id] || 0;
    const dem = demand[d.id] || 0;
    const share = authorTotal ? dem / authorTotal : 0;
    html += '<div class="alloc' + (v > 0 ? " set" : "") + '">' +
      '<div class="who">Your card</div><h3>' + esc(d.title) + "</h3>" +
      '<div class="meme">' + esc(d.meme) + "</div>" +
      '<div class="req">Aggregate desire <b style="color:var(--accent2)">' + dem + "</b> &middot; " +
      (share * 100).toFixed(0) + "% of your set</div>" +
      '<div class="ctl"><input type="range" min="0" max="' + budget + '" value="' + v + '" data-def="' + d.id + '">' +
      '<input type="number" min="0" max="' + budget + '" value="' + v + '" data-def="' + d.id + '"></div></div>';
  }
  html += "</div>";
  return html;
}

function demandMap(set){
  const demand = {};
  for(const d of set.designs) demand[d.id] = 0;
  for(const bidder in set.bids){
    const row = set.bids[bidder];
    for(const id in row) if(demand[id] != null) demand[id] += row[id] || 0;
  }
  return demand;
}

function revealSummary(set){
  if(!set.snapshot) return "";
  const s = set.snapshot;
  let html = '<div class="metrics">' +
    metric("Total desire", s.totalDemand, "Tokens actually spent") +
    metric("Average / card", s.avgCard.toFixed(2), "Scarcity baseline") +
    metric("Average / author", s.avgAuthor.toFixed(2), "Reward baseline") +
    metric("Standard hit", pct(s.standard.hit, 3), oneIn(s.standard.hit) + " packs") +
    metric("Reward pool", s.rewardPool + " C", "Paid to authors") +
    "</div>";
  return html;
}
function metric(label, value, sub){
  return '<div class="metric"><span>' + esc(label) + "</span><b>" + esc(String(value)) + "</b><small>" + esc(sub) + "</small></div>";
}

/* ---- finalisation: the one moment everything freezes ------ */

function finalizeMarket(set){
  const cfg = set.config;
  const designs = set.designs;
  const ids = set.participants;
  if(!designs.length || !ids.length) return "nothing to finalize";
  // Rewards and bidder packs are granted exactly once. The snapshot is the
  // receipt: if it exists, this set has already paid out.
  if(set.snapshot) return "Set " + set.ordinal + " has already been finalized; rewards were paid once.";

  // D_c
  const demand = demandMap(set);
  let totalDemand = 0;
  for(const id in demand) totalDemand += demand[id];

  const avgCard   = designs.length ? totalDemand / designs.length : 0;   // Dbar_c
  const avgAuthor = ids.length ? totalDemand / ids.length : 0;           // Dbar_a

  // D_a
  const authorDemand = {};
  for(const id of ids){
    authorDemand[id] = designs.filter(d => d.authorId === id)
      .reduce((a, d) => a + (demand[d.id] || 0), 0);
  }

  // R_a with an exact N * R_avg pool
  const rewards = largestRemainder(authorDemand, cfg.avgSetReward);

  // S_c
  const scar = {};
  for(const d of designs) scar[d.id] = scarcity(demand[d.id], avgCard, cfg.scarcityExponent);

  // h and the standard distribution
  const hit = standardHit(expectedBudget(cfg), cfg.targetHits, cfg.packCost, cfg.failRefund);
  const std = standardOdds(scar, hit, cfg.failRefund);

  // h_a per author
  const authorHit = {};
  for(const id of ids){
    authorHit[id] = avgAuthor <= 0 ? 1 : 1 / (1 + authorDemand[id] / avgAuthor);
  }

  // pay the authors
  let pool = 0;
  for(const id of ids){
    credit(id, rewards[id], "SET_MARKET_REWARD", "Set " + set.ordinal + " desire market");
    pool += rewards[id];
  }

  // original bidder packs: one per bidder per author, if any card was breached
  let packsMade = 0;
  for(const bidderId of ids){
    for(const authorId of ids){
      if(bidderId === authorId) continue;
      const own = designs.filter(d => d.authorId === authorId);
      const raw = {}, eff = {}, def = {}, sc = {};
      let breached = false;
      for(const d of own){
        raw[d.id] = (set.bids[bidderId] || {})[d.id] || 0;
        def[d.id] = set.defense[d.id] || 0;
        eff[d.id] = effectiveBid(raw[d.id], def[d.id]);
        sc[d.id]  = scar[d.id];
        if(eff[d.id] > 0) breached = true;
      }
      if(!breached) continue;
      const odds = bidderOdds(sc, eff, cfg.desireBudget, cfg.boostBase,
                              authorDemand[authorId], avgAuthor, cfg.bidderFailReward);
      S.packs.push({
        id: nextId("pack"), type: "BIDDER", setId: set.id, authorId, originBidderId: bidderId,
        ownerId: bidderId, odds, raw, defense: def, effective: eff,
        opened: false, createdAt: Date.now(), tradeCount: 0
      });
      packsMade++;
    }
  }

  set.snapshot = {
    totalDemand, avgCard, avgAuthor,
    demand, scarcity: scar, authorDemand, rewards, authorHit,
    standard: std, rewardPool: pool, config: Object.assign({}, cfg),
    finalizedAt: Date.now()
  };
  set.state = "LIVE";
  logEvent("Set " + set.ordinal + " finalized: " + totalDemand + " desire, " + pool + " C paid, " + packsMade + " bidder packs.");
  return null;
}

/* ============================================================
   9. PACKS — rolling, opening, legacy
   ============================================================ */

function createInstance(designId, setId, ownerId, source, packId){
  const inst = {
    id: nextId("instance"), designId: Number(designId), setId,
    ownerId, pullerId: ownerId,
    floatValue: randInt(100001),   // 0..100000, shown at 5 decimals
    catalog: randInt(1000),        // 000..999
    state: "ACTIVE", source, sourcePackId: packId || null,
    createdAt: Date.now(), tradeCount: 0, note: ""
  };
  S.instances.push(inst);
  return inst;
}

// L_s = 1 / (k - s)^gamma over finalized older sets
function legacyPool(currentSet){
  const gamma = currentSet.config.legacyAgeExponent;
  const pool = {};
  for(const s of S.sets){
    if(s.ordinal >= currentSet.ordinal || !s.snapshot) continue;
    const d = currentSet.ordinal - s.ordinal;
    pool[s.id] = 1 / Math.pow(d, gamma);
  }
  return pool;
}

function rollStandard(playerId){
  const set = liveSet();
  if(!set || !set.snapshot) return {error:"No set is LIVE."};
  const cfg = set.config;
  const p = player(playerId);
  if(!p) return {error:"Pick who is buying."};
  if(p.credits < cfg.packCost) return {error: p.name + " needs " + cfg.packCost + " C and has " + p.credits + " C."};

  credit(playerId, -cfg.packCost, "STANDARD_PACK_PURCHASE", "Set " + set.ordinal + " Standard Pack");
  const odds = set.snapshot.standard;
  const out = {type:"STANDARD", setId:set.id, odds, playerId};

  if(chance(odds.hit)){
    const designId = Number(pickWeighted(odds.conditional));
    out.outcome = "CARD";
    out.instance = createInstance(designId, set.id, playerId, "STANDARD");
    logEvent(p.name + " pulled " + designText(designId) + " from a Standard Pack.");
  } else {
    credit(playerId, cfg.failRefund, "STANDARD_FAIL_REFUND", "Standard Pack fail");
    out.outcome = "FAIL";
    out.refund = cfg.failRefund;
    // hidden independent legacy roll — only ever on a CURRENT standard fail
    const pool = legacyPool(set);
    if(Object.keys(pool).length && chance(cfg.legacyTrigger)){
      const srcId = Number(pickWeighted(pool));
      const src = getSet(srcId);
      const pack = {
        id: nextId("pack"), type:"LEGACY", setId: srcId, authorId:null, originBidderId:null,
        ownerId: playerId,
        odds: {
          hit: src.snapshot.standard.hit, fail: src.snapshot.standard.fail,
          conditional: src.snapshot.standard.conditional, cards: src.snapshot.standard.cards,
          failReward: src.config.failRefund
        },
        opened:false, createdAt:Date.now(), tradeCount:0
      };
      S.packs.push(pack);
      out.legacy = pack;
      logEvent(p.name + " uncovered a Legacy Pack from Set " + src.ordinal + ".");
    }
  }
  return out;
}

function openPack(packId, playerId){
  const pack = S.packs.find(p => p.id === Number(packId));
  if(!pack) return {error:"Pack not found."};
  if(pack.opened) return {error:"Already opened."};
  if(pack.ownerId !== playerId) return {error:"That pack belongs to " + playerName(pack.ownerId) + "."};
  const out = {type: pack.type, setId: pack.setId, odds: pack.odds, playerId, packId: pack.id};
  if(chance(pack.odds.hit)){
    const designId = Number(pickWeighted(pack.odds.conditional));
    out.outcome = "CARD";
    out.instance = createInstance(designId, pack.setId, playerId, pack.type, pack.id);
    logEvent(playerName(playerId) + " opened a " + pack.type + " pack: " + designText(designId) + ".");
  } else {
    const reward = pack.odds.failReward || 0;
    if(reward) credit(playerId, reward, pack.type + "_FAIL_REWARD", pack.type + " pack fail");
    out.outcome = "FAIL";
    out.refund = reward;
    logEvent(playerName(playerId) + " opened a " + pack.type + " pack: no card.");
  }
  // a legacy pack NEVER rolls another legacy pack — the chain stops here
  pack.opened = true;
  pack.openedAt = Date.now();
  return out;
}

function designText(designId){
  const f = findDesign(designId);
  return f ? (playerName(f.design.authorId) + " — " + f.design.title) : "card #" + designId;
}

/* ---- the reel ------------------------------------------- */

const TILE_W = 132, TILE_GAP = 12, STEP = TILE_W + TILE_GAP, WIN_INDEX = 48, TILE_COUNT = 56;
let audioCtx = null;

function tick(){
  if(!S.ui.sound) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(760 + randInt(120), t);
    gain.gain.setValueAtTime(0.05, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.06);
  }catch(e){}
}

function sampleTile(odds){
  if(chance(odds.hit)) return {kind:"CARD", designId: Number(pickWeighted(odds.conditional))};
  return {kind:"FAIL"};
}

function mixRgb(from, to, t){
  const channel = i => Math.round(from[i] + (to[i] - from[i]) * t);
  return channel(0) + "," + channel(1) + "," + channel(2);
}

function relativeCardColor(designId, odds){
  // Rank within this pack from most common to rarest. Design ID is a stable
  // tie-break so exactly one card receives the golden top-card treatment.
  const ranked = Object.keys(odds.cards || {}).map(id => ({
    id: Number(id), p: Number(odds.cards[id]) || 0
  })).sort((a, b) => b.p - a.p || a.id - b.id);
  const index = ranked.findIndex(card => card.id === Number(designId));
  const last = ranked.length - 1;

  if(index === last){
    return {border:"rgb(255,215,0)", glow:"rgba(255,215,0,.38)"};
  }

  // The non-golden range runs from dark blue at the most common card to
  // neon red at the second-rarest card, with a smooth RGB transition between.
  const t = Math.max(0, Math.min(1, index / Math.max(1, ranked.length - 2)));
  const rgb = mixRgb([8,35,92], [255,20,60], t);
  return {border:"rgb(" + rgb + ")", glow:"rgba(" + rgb + "," + (.14 + t * .22).toFixed(2) + ")"};
}

function tileHtml(tile, odds){
  if(tile.kind === "FAIL"){
    return '<div class="tile fail"><div class="tw">Outcome</div><div class="tt">NO CARD</div>' +
      '<div class="tp">refund +' + (odds.failReward || 0) + " C</div></div>";
  }
  const f = findDesign(tile.designId);
  const p = odds.cards[tile.designId] || 0;
  const color = relativeCardColor(tile.designId, odds);
  return '<div class="tile" style="border-color:' + color.border + ";background:linear-gradient(160deg," + color.glow + ",#1b2130 70%)\">" +
    '<div class="tw">' + esc(f ? playerName(f.design.authorId) : "?") + "</div>" +
    '<div class="tt">' + esc(f ? f.design.title : "#" + tile.designId) + "</div>" +
    '<div class="tp">' + pct(p) + "</div></div>";
}

function showPackAnimation(result){
  const odds = result.odds;
  const winner = result.outcome === "CARD"
    ? {kind:"CARD", designId: result.instance.designId}
    : {kind:"FAIL"};

  const tiles = [];
  for(let i = 0; i < TILE_COUNT; i++){
    tiles.push(i === WIN_INDEX ? winner : sampleTile(odds));
  }

  const host = document.getElementById("overlayHost");
  host.innerHTML =
    '<div class="overlay" id="packOverlay"><div class="modal reelbox">' +
      '<p class="eyebrow" style="text-align:center">' + result.type + " PACK &middot; " + esc(playerName(result.playerId)) + "</p>" +
      '<div class="reelview"><div class="reelcenter"></div>' +
        '<div class="strip" id="strip">' + tiles.map(t => tileHtml(t, odds)).join("") + "</div>" +
      "</div>" +
      '<div id="reelResult"></div>' +
    "</div></div>";

  const strip = document.getElementById("strip");
  const view = strip.parentElement;
  const jitter = randInt(70) - 35;
  const target = WIN_INDEX * STEP + TILE_W / 2 - view.clientWidth / 2 + jitter;

  const DURATION = 4.6;
  strip.style.transition = "none";
  strip.style.transform = "translateX(0px)";
  void strip.offsetWidth;
  strip.style.transition = "transform " + DURATION + "s cubic-bezier(.11,.72,.09,1)";
  strip.style.transform = "translateX(" + (-target) + "px)";

  // ticks read the real transform each frame, so they stay in sync with the easing
  let last = -1, running = true, settled = false;
  (function frame(){
    if(!running) return;
    const m = new DOMMatrixReadOnly(getComputedStyle(strip).transform);
    const idx = Math.floor((-m.m41 + view.clientWidth / 2) / STEP);
    if(idx !== last){ last = idx; tick(); }
    requestAnimationFrame(frame);
  })();

  // The result must appear even if the transition never completes — a background
  // tab, a reduced-motion setting or a throttled renderer can all swallow
  // transitionend, and the outcome is already decided either way.
  function settle(){
    if(settled) return;
    settled = true;
    running = false;
    strip.style.transition = "none";
    strip.style.transform = "translateX(" + (-target) + "px)";
    const host = document.getElementById("reelResult");
    if(host) host.innerHTML = resultHtml(result);
  }
  strip.addEventListener("transitionend", settle, {once:true});
  setTimeout(settle, DURATION * 1000 + 400);
  view.addEventListener("click", settle);   // click the reel to skip
}

function resultHtml(result){
  let html = '<div class="result">';
  if(result.outcome === "CARD"){
    const i = result.instance;
    const f = findDesign(i.designId);
    html += "<h2>" + esc(f ? f.design.title : "Card") + "</h2>";
    html += '<p style="color:var(--accent2)">' + esc(f ? playerName(f.design.authorId) : "") + "</p>";
    html += '<div class="serial"><b>' + floatText(i.floatValue) + "</b><b>&#8470; " + catalogText(i.catalog) + "</b></div>";
    html += "<small>Pulled at " + pct(result.odds.cards[i.designId] || 0) + " &middot; " + oneIn(result.odds.cards[i.designId] || 0) + " packs</small>";
  } else {
    html += '<h2 style="color:var(--dim)">No card this time.</h2>';
    html += "<p>Refund +" + (result.refund || 0) + " Credits</p>";
  }
  if(result.legacy){
    const src = getSet(result.legacy.setId);
    html += '<div class="legacyflash"><b>Legacy drop.</b> A sealed Set ' + (src ? src.ordinal : "?") +
      " pack fell out of the wrapper. It is waiting in the Shop.</div>";
  }
  html += '<div class="row" style="justify-content:center;margin-top:16px">' +
    '<button class="primary big" data-act="closeOverlay">Continue</button></div></div>';
  return html;
}

  }
  html += "</tbody></table></div>";

  html += '<details><summary>Show the math behind these numbers</summary><div class="math" style="margin-top:10px">' +
    "total desire &Sigma;D = <b>" + s.totalDemand + "</b><br>" +
    "cards M = <b>" + set.designs.length + "</b> &nbsp; players N = <b>" + set.participants.length + "</b><br>" +
    "D&#772;<sub>c</sub> = &Sigma;D / M = <b>" + s.avgCard.toFixed(4) + "</b><br>" +
    "D&#772;<sub>a</sub> = &Sigma;D / N = <b>" + s.avgAuthor.toFixed(4) + "</b><br><br>" +
    "S<sub>c</sub> = (1 + D<sub>c</sub>/D&#772;<sub>c</sub>)<sup>&minus;" + cfg.scarcityExponent + "</sup><br>" +
    "q<sub>c</sub> = S<sub>c</sub> / &Sigma;S<sub>j</sub> &nbsp;&rarr;&nbsp; P(c) = h &middot; q<sub>c</sub><br><br>" +
    "B = " + cfg.avgSetReward + " + " + cfg.weeklyRefill + "&times;" + cfg.expectedRefills + " = <b>" + expectedBudget(cfg) + "</b><br>" +
    "h = T(C&minus;F)/(B&minus;TF) = " + cfg.targetHits + "(" + cfg.packCost + "&minus;" + cfg.failRefund + ")/(" +
      expectedBudget(cfg) + "&minus;" + (cfg.targetHits * cfg.failRefund) + ") = <b>" + s.standard.hit.toFixed(10) + "</b><br>" +
    "all outcomes sum to <b>" + oddsSum(s.standard).toFixed(10) + "</b><br><br>" +
    "R<sub>a</sub> = " + cfg.avgSetReward + " &middot; D<sub>a</sub>/D&#772;<sub>a</sub> &nbsp;&rarr;&nbsp; pool = N &times; " +
      cfg.avgSetReward + " = <b>" + s.rewardPool + "</b> C exactly<br>" +
    "h<sub>a</sub> = 1 / (1 + D<sub>a</sub>/D&#772;<sub>a</sub>)<br>" +
    "e<sub>ic</sub> = b<sub>ic</sub> if b<sub>ic</sub> &gt; d<sub>c</sub>, else 0 &nbsp;&middot;&nbsp; M<sub>ic</sub> = " +
      cfg.boostBase + "<sup>e/" + cfg.desireBudget + "</sup>" +
    "</div></details>";
  html += "</div>";

  // breach board
  html += breachBoard(set);
  html += tradingPost();
  return html;
}

function breachBoard(set){
  const s = set.snapshot;
  let html = '<div class="panel"><h2>Bids, defense and breaches</h2>' +
    "<p><small>Now public. A bid breaches only when strictly greater than the defense. Blocked bids still counted toward desire and income — they just bought no personal pack weighting.</small></p>";
  html += '<div class="tablewrap"><table><thead><tr><th>Request</th><th class="num">Defense</th><th>Bids</th></tr></thead><tbody>';
  for(const d of set.designs){
    const def = set.defense[d.id] || 0;
    const bids = [];
    for(const bidder in set.bids){
      const amt = set.bids[bidder][d.id] || 0;
      if(amt > 0) bids.push({bidder: Number(bidder), amt, breached: amt > def});
    }
    bids.sort((a, b) => b.amt - a.amt);
    html += "<tr><td>" + esc(playerName(d.authorId)) + " — <b>" + esc(d.title) + "</b></td>" +
      '<td class="num">' + def + "</td><td>" +
      (bids.length ? bids.map(b =>
        '<span class="pill" style="margin-right:4px;color:' + (b.breached ? "var(--good)" : "var(--dim)") + '">' +
        esc(playerName(b.bidder)) + " " + b.amt + (b.breached ? " ⚡" : " blocked") + "</span>").join("")
        : '<small style="color:var(--dim)">no bids</small>') +
      "</td></tr>";
  }
  html += "</tbody></table></div>";
  const packs = S.packs.filter(p => p.setId === set.id && p.type === "BIDDER");
  html += "<p style=\"margin-top:10px\"><small>" + packs.length + " Original Bidder Packs were created (one per bidder per breached author). " +
    packs.filter(p => !p.opened).length + " still sealed.</small></p>";
  html += "</div>";
  return html;
}

function tradingPost(){
  const from = S.ui.tradeFrom && player(S.ui.tradeFrom) ? S.ui.tradeFrom : (S.players[0] ? S.players[0].id : null);
  if(!from) return "";
  const cards = S.instances.filter(i => i.ownerId === from && i.state !== "CONSUMED");
  const packs = S.packs.filter(p => p.ownerId === from && !p.opened);
  let html = '<div class="panel"><h2>Trading post</h2>' +
    "<p><small>The table agrees a trade out loud; the host records it here. Pack odds are frozen at creation and never change hands' worth of probability.</small></p>";
  html += '<div class="row" style="align-items:flex-end">';
  html += '<label style="margin:0">From<select data-act="tradeFrom" style="width:auto;min-width:130px">' +
    S.players.map(p => '<option value="' + p.id + '"' + (p.id === from ? " selected" : "") + ">" + esc(p.name) + "</option>").join("") + "</select></label>";
  html += '<label style="margin:0">Item<select id="tradeItem" style="width:auto;min-width:250px">' +
    '<option value="">— choose —</option>' +
    cards.map(i => {
      const f = findDesign(i.designId);
      return '<option value="card:' + i.id + '">Card #' + i.id + " · " + esc(f ? f.design.title : "?") +
        " · " + floatText(i.floatValue) + " · " + i.state + "</option>";
    }).join("") +
    packs.map(p => '<option value="pack:' + p.id + '">Pack #' + p.id + " · " + p.type +
      (p.authorId ? " · " + esc(playerName(p.authorId)) : "") + "</option>").join("") +
    "</select></label>";
  html += '<label style="margin:0">To<select id="tradeTo" style="width:auto;min-width:130px">' +
    S.players.map(p => '<option value="' + p.id + '">' + esc(p.name) + "</option>").join("") + "</select></label>";
  html += '<button class="primary" data-act="moveItem">Move item</button>';
  html += "</div>";
  html += '<div class="row" style="align-items:flex-end;margin-top:12px">';
  html += '<label style="margin:0">Credits<input id="tradeCredits" type="number" min="1" value="50" style="width:110px"></label>';
  html += '<button data-act="sendCredits">Send Credits from ' + esc(playerName(from)) + " to the 'To' player</button>";
  html += "</div></div>";
  return html;
}

function viewCards(){
  const a = acting();
  let html = '<div class="title"><h1>Cards</h1><p>Every instance ever created, with its permanent float and catalog number. Duplicate rights collide by lowest float, then lowest catalog.</p></div>';
  html += noticeHtml();

  const f = S.ui.cardFilter || {};
  const owner = f.owner == null ? (a ? String(a.id) : "ALL") : f.owner;
  const list = S.instances.filter(i => {
    if(i.state === "CONSUMED" && f.state !== "CONSUMED") return false;
    if(owner !== "ALL" && i.ownerId !== Number(owner)) return false;
    if(f.set && f.set !== "ALL" && i.setId !== Number(f.set)) return false;
    if(f.state && f.state !== "ALL" && i.state !== f.state) return false;
    if(f.q){
      const d = findDesign(i.designId);
      const text = (d ? d.design.title + " " + d.design.meme + " " + d.design.request + " " + playerName(d.design.authorId) : "").toLowerCase();
      if(text.indexOf(f.q.toLowerCase()) < 0) return false;
    }
    return true;
  });
  const sort = f.sort || "new";
  list.sort((x, y) => {
    if(sort === "float")   return x.floatValue - y.floatValue;
    if(sort === "catalog") return x.catalog - y.catalog;
    if(sort === "title"){
      const dx = findDesign(x.designId), dy = findDesign(y.designId);
      return (dx ? dx.design.title : "").localeCompare(dy ? dy.design.title : "");
    }
    return y.createdAt - x.createdAt;
  });

  html += '<div class="panel"><div class="row">';
  html += '<label style="margin:0;flex:1;min-width:170px">Search<input data-filter="q" value="' + esc(f.q || "") + '" placeholder="Title, person, request"></label>';
  html += '<label style="margin:0">Owner<select data-filter="owner"><option value="ALL">Everyone</option>' +
    S.players.map(p => '<option value="' + p.id + '"' + (owner === String(p.id) ? " selected" : "") + ">" + esc(p.name) + "</option>").join("") + "</select></label>";
  html += '<label style="margin:0">Set<select data-filter="set"><option value="ALL">All sets</option>' +
    S.sets.map(s => '<option value="' + s.id + '"' + (f.set === String(s.id) ? " selected" : "") + ">Set " + s.ordinal + "</option>").join("") + "</select></label>";
  html += '<label style="margin:0">State<select data-filter="state">' +
    ["ALL","ACTIVE","REDEEMED","CONSUMED"].map(x => '<option' + (f.state === x ? " selected" : "") + ">" + x + "</option>").join("") + "</select></label>";
  html += '<label style="margin:0">Sort<select data-filter="sort">' +
    [["new","Newest"],["float","Lowest float"],["catalog","Lowest catalog"],["title","Title"]]
      .map(x => '<option value="' + x[0] + '"' + (sort === x[0] ? " selected" : "") + ">" + x[1] + "</option>").join("") + "</select></label>";
  html += '<div style="text-align:right"><b style="font-size:22px">' + list.length + "</b><br><small>shown</small></div>";
  html += "</div></div>";

  if(!list.length){
    html += '<div class="empty">No cards match. Open a pack in the Shop, or let the host issue one from Players.</div>';
  } else {
    html += '<div class="cardgrid">';
    for(const i of list){
      const d = findDesign(i.designId);
      const set = getSet(i.setId);
      const p = set && set.snapshot ? (set.snapshot.standard.cards[i.designId] || 0) : 0;
      html += '<div class="coll" data-act="inspect" data-id="' + i.id + '">' +
        '<div class="who">' + esc(d ? playerName(d.design.authorId) : "?") + " &middot; SET " + (set ? set.ordinal : "?") + "</div>" +
        "<h3>" + esc(d ? d.design.title : "#" + i.designId) + "</h3>" +
        "<small>" + esc(d ? d.design.meme : "") + "</small>" +
        '<div class="ser"><b>' + floatText(i.floatValue) + "</b><b>&#8470; " + catalogText(i.catalog) + "</b></div>" +
        '<div class="row" style="justify-content:space-between"><span class="state ' + i.state + '">' + i.state + "</span>" +
        "<small>" + (p ? pct(p) : "—") + "</small></div>" +
        "<div style=\"margin-top:6px\"><small>held by " + esc(playerName(i.ownerId)) + "</small></div></div>";
    }
    html += "</div>";
  }

  html += craftPanel();
  return html;
}

function craftPanel(){
  const a = acting();
  if(!a) return "";
  let html = '<div class="panel" style="margin-top:16px"><h2>Crafting</h2>' +
    "<p><small>Three identical ACTIVE copies convert upward into a strictly more-wanted request from the same set. " +
    "Three REDEEMED cards of yourself from one set convert into a Reclaimed Pack with no personal bidder boost.</small></p>";

  // 3x upgrade candidates
  const groups = {};
  for(const i of S.instances){
    if(i.ownerId !== a.id || i.state !== "ACTIVE") continue;
    (groups[i.designId] = groups[i.designId] || []).push(i);
  }
  const upgradable = Object.keys(groups).filter(k => groups[k].length >= 3);
  if(!upgradable.length){
    html += '<p><small style="color:var(--dim)">' + esc(a.name) + " has no set of three identical ACTIVE cards.</small></p>";
  } else {
    for(const key of upgradable){
      const d = findDesign(Number(key));
      const set = d.set;
      const src = set.snapshot ? (set.snapshot.demand[key] || 0) : 0;
      const eligible = set.snapshot
        ? set.designs.filter(x => (set.snapshot.demand[x.id] || 0) > src) : [];
      html += '<div class="packrow"><div class="grow"><b>' + esc(d.design.title) + "</b> &times;" + groups[key].length +
        "<br><small>desire " + src + " &middot; " + eligible.length + " higher-demand targets</small></div>" +
        '<button class="primary" data-act="craftUpgrade" data-id="' + key + '"' + (eligible.length ? "" : " disabled") + ">" +
        (eligible.length ? "Craft upward" : "Nothing higher") + "</button></div>";
    }
  }

  // reclaim candidates
  const bySet = {};
  for(const i of S.instances){
    if(i.ownerId !== a.id || i.state !== "REDEEMED") continue;
    const d = findDesign(i.designId);
    if(!d || d.design.authorId !== a.id) continue;
    (bySet[i.setId] = bySet[i.setId] || []).push(i);
  }
  for(const setId in bySet){
    if(bySet[setId].length < 3) continue;
    const set = getSet(setId);
    html += '<div class="packrow"><div class="grow"><b>Reclaim from Set ' + set.ordinal + "</b>" +
      "<br><small>" + bySet[setId].length + " redeemed cards of yourself</small></div>" +
      '<button class="primary" data-act="craftReclaim" data-id="' + setId + '">Reclaim a pack</button></div>';
  }
  html += "</div>";
  return html;
}

function inspectCard(id){

  if(!i) return;
  const d = findDesign(i.designId);
  const set = getSet(i.setId);

    '<b class="state ' + i.state + '" style="font-size:13px;display:flex;align-items:center">' + i.state + "</b></div>";
  html += '<div class="split">';
  html += '<div><p class="eyebrow">The request</p><h3>' + esc(d ? d.design.request : "") + "</h3><p><small>" + esc(d ? d.design.limits : "") + "</small></p></div>";
  html += '<div><p class="eyebrow">Original market</p><table><tbody>' +
    "<tr><td>Desire</td><td class=\"num\">" + (snap ? (snap.demand[i.designId] || 0) : "—") + "</td></tr>" +
    "<tr><td>Scarcity</td><td class=\"num\">" + (snap ? (snap.scarcity[i.designId] || 0).toFixed(6) : "—") + "</td></tr>" +
    "<tr><td>Pack chance</td><td class=\"num\">" + (p ? pct(p) : "—") + "</td></tr>" +
    "<tr><td>Rate</td><td class=\"num\">" + (p ? oneIn(p) : "—") + "</td></tr>" +
    "</tbody></table></div>";
  html += "</div>";
  html += '<p class="eyebrow" style="margin-top:14px">Provenance</p><table><tbody>' +
    "<tr><td>Held by</td><td>" + esc(playerName(i.ownerId)) + "</td></tr>" +
    "<tr><td>First pulled by</td><td>" + esc(playerName(i.pullerId)) + "</td></tr>" +
    "<tr><td>Source</td><td>" + esc(i.source) + "</td></tr>" +
    "<tr><td>Created</td><td>" + when(i.createdAt) + "</td></tr>" +
    "<tr><td>Times traded</td><td>" + i.tradeCount + "</td></tr>" +
    (i.note ? "<tr><td>Note</td><td>" + esc(i.note) + "</td></tr>" : "") +
    "</tbody></table>";
  if(i.state === "ACTIVE" || i.state === "REDEEMED"){
    html += '<div class="row" style="margin-top:16px">';
    if(i.state === "ACTIVE")   html += '<button class="primary" data-act="redeemCard" data-id="' + i.id + '">Mark the promise redeemed</button>';
    if(i.state === "REDEEMED") html += '<button data-act="unredeemCard" data-id="' + i.id + '">Return to ACTIVE</button>';
    html += "</div>";
  }
  showModal(html);
}
